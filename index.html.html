<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Golden Curse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column. HUD strip, battlefield canvas, info line, tower bar, wave controls. */
:root{
  --bg:#12171a; --panel:#1b2226; --line:#2d3a40; --fg:#e8eee9; --muted:#8fa19a;
  --accent:#e0b03c; --good:#62c96c; --bad:#e2574a; --btn:#2a363b;
  --font-head:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1ee; --panel:#ffffff; --line:#ccd6d1; --fg:#1a2220; --muted:#5a6a63;
    --accent:#9a6b00; --good:#2f8a3e; --bad:#b8372c; --btn:#e3e9e5;
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#eef1ee; --panel:#ffffff; --line:#ccd6d1; --fg:#1a2220; --muted:#5a6a63;
  --accent:#9a6b00; --good:#2f8a3e; --bad:#b8372c; --btn:#e3e9e5;
  color-scheme: light;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;
}
.app{max-width:440px; margin:0 auto; display:flex; flex-direction:column; gap:10px}
.hud{display:flex; align-items:center; justify-content:space-between; gap:8px}
.hud h1{font-family:var(--font-head); font-size:16px; margin:0; letter-spacing:.02em}
.stats{display:flex; gap:12px; font-variant-numeric:tabular-nums; font-weight:600}
.stats span{display:inline-flex; align-items:baseline; gap:4px}
.stats small{font-weight:500; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em}
#gold{color:var(--accent)}
.field{position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#35502f}
canvas{display:block; width:100%; height:auto; aspect-ratio:352/440; touch-action:manipulation}
.overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:24px; background:rgba(10,14,12,.82); color:#f2f5f0}
.overlay h2{font-family:var(--font-head); margin:0; font-size:22px}
.overlay p{margin:0; max-width:28ch; color:#cfd8d2}
.info{min-height:58px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px}
.info div{min-width:0; line-height:1.4}
.bar{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px}
.tw{background:var(--btn); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 2px 6px; font:inherit; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer}
.tw .sw{width:22px; height:22px; border-radius:50%; border:3px solid #6e4a2a}
.tw .nm{font-size:10.5px; line-height:1.15; text-align:center; min-height:24px; display:flex; align-items:center}
.tw .co{font-size:12px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums}
.tw[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset}
.tw.poor{opacity:.5}
.ctl{display:flex; gap:8px}
button{font:inherit}
.btn{background:var(--btn); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-weight:600; cursor:pointer}
.btn.primary{background:var(--accent); color:#1a1300; border-color:var(--accent); flex:1}
.btn:disabled{opacity:.5; cursor:default}
.btn.danger{color:var(--bad)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.foot{color:var(--muted); font-size:12px; line-height:1.45}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="app">
  <div class="hud">
    <h1>Golden Curse</h1>
    <div class="stats">
      <span><small>Gold</small><b id="gold">100</b></span>
      <span><small>Lives</small><b id="lives">20</b></span>
      <span><small>Wave</small><b id="wave">1/5</b></span>
    </div>
  </div>

  <div class="field">
    <canvas id="cv" aria-label="Battlefield"></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <button class="btn primary" id="ovBtn" style="flex:none">Play again</button>
    </div>
  </div>

  <div class="info">
    <div id="infoText">Pick a tower, then tap a free tile. Spike Traps go on the brown track.</div>
    <button class="btn danger" id="sellBtn" hidden>Sell</button>
  </div>

  <div class="bar" id="bar"></div>

  <div class="ctl">
    <button class="btn primary" id="startBtn">Start Wave 1</button>
    <button class="btn" id="speedBtn" aria-label="Game speed">1x</button>
  </div>

  <div class="foot">Level 1: Carnotaurus. Survive 5 waves. Tap a tower or dinosaur on the field to see its stats.</div>
</div>

<script>
(function(){
'use strict';

var COLS=8, ROWS=10, CELL=44, W=COLS*CELL, H=ROWS*CELL;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var dpr=Math.min(2, window.devicePixelRatio||1);
cv.width=W*dpr; cv.height=H*dpr;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx, ay-by);}

/* ---------- track ---------- */
var WP=[[-0.5,1],[6,1],[6,3],[1,3],[1,5],[6,5],[6,7],[1,7],[1,9.5]];
var pts=WP.map(function(p){return {x:(p[0]+0.5)*CELL, y:(p[1]+0.5)*CELL};});
var segLen=[], total=0, i;
for(i=1;i<pts.length;i++){
  var l=dist(pts[i].x,pts[i].y,pts[i-1].x,pts[i-1].y); segLen.push(l); total+=l;
}
function posAt(d){
  var k=0;
  while(k<segLen.length && d>segLen[k]){ d-=segLen[k]; k++; }
  if(k>=segLen.length) return pts[pts.length-1];
  var t=d/segLen[k];
  return {x:pts[k].x+(pts[k+1].x-pts[k].x)*t, y:pts[k].y+(pts[k+1].y-pts[k].y)*t};
}
var pathSet={};
for(i=1;i<WP.length;i++){
  var a=WP[i-1], b=WP[i];
  var c0=clamp(Math.round(Math.min(a[0],b[0])),0,COLS-1), c1=clamp(Math.round(Math.max(a[0],b[0])),0,COLS-1);
  var r0=clamp(Math.round(Math.min(a[1],b[1])),0,ROWS-1), r1=clamp(Math.round(Math.max(a[1],b[1])),0,ROWS-1);
  for(var cc=c0;cc<=c1;cc++){ for(var rr=r0;rr<=r1;rr++){ pathSet[cc+','+rr]=true; } }
}
var flyStart=pts[0], flyEnd=pts[pts.length-1];
var flyLen=dist(flyStart.x,flyStart.y,flyEnd.x,flyEnd.y);

/* ---------- data ---------- */
var ENEMIES={
  compy:{name:'Compy', color:'#8fd36a', r:7,  hp:18,  spd:2.0, gold:3,  note:'Small and fast.'},
  raptor:{name:'Raptor', color:'#d9453a', r:9,  hp:42,  spd:1.5, gold:5,  note:'Quick and tougher than a Compy.'},
  dilo:{name:'Dilophosaurus', color:'#9b6bd1', r:9, hp:70, spd:1.0, gold:8, note:'Spits on a tower and slows its attack speed by 50% for 6s.'},
  troodon:{name:'Troodon', color:'#e8963a', r:7, hp:38, spd:1.8, gold:6, note:'Jumps over a Spike Trap, then needs 1s before it can jump again.'},
  ptera:{name:'Pteranodon', color:'#8a94a6', r:9, hp:22, spd:2.6, gold:6, fly:true, note:'Flies straight over the map. Fast and fragile.'},
  trike:{name:'Triceratops', color:'#3e78d6', r:13, hp:260, spd:0.7, gold:15, note:'Slow with lots of health.'},
  carno:{name:'Carnotaurus', color:'#6b2a1f', r:17, hp:800, spd:0.75, gold:60, boss:true, note:'Mini-boss. Charges at double speed every few seconds.'}
};
var TOWERS={
  spear:{name:'Spear Hunter', cost:50, range:2.7, dmg:12, cd:0.8, color:'#e6d8a8', air:true, note:'Balanced single target. Hits air.'},
  slinger:{name:'Rock Slinger', cost:40, range:2.3, dmg:4, cd:0.28, color:'#b9bec4', air:true, note:'Fast, low damage. Hits air.'},
  bola:{name:'Bola Trapper', cost:60, range:2.5, dmg:3, cd:1.1, color:'#55c1a2', air:true, note:'Slows enemies. Tangles flyers harder.'},
  totem:{name:'Spirit Totem', cost:70, range:2.4, dmg:0, cd:0, color:'#62c96c', note:'Nearby towers attack 30% faster. Cleanses one slimed tower every 5s.'},
  spike:{name:'Spike Trap', cost:30, range:0, dmg:18, cd:0, color:'#8d949b', note:'Place on the track. Hurts ground enemies. Lasts 10 uses.'}
};
var ORDER=['spear','slinger','bola','totem','spike'];
var WAVES=[
  {list:[['compy',8],['raptor',4],['dilo',2]]},
  {list:[['compy',8],['dilo',3],['troodon',5]]},
  {list:[['compy',6],['troodon',5],['ptera',4]]},
  {list:[['compy',8],['dilo',4],['trike',3]]},
  {list:[['compy',8],['raptor',4],['dilo',3],['troodon',4],['ptera',3],['trike',3]], boss:true}
];
var WAVE_BONUS=15, START_GOLD=100, START_LIVES=20;

/* ---------- state ---------- */
var G;
function reset(){
  G={gold:START_GOLD, lives:START_LIVES, wave:1, state:'idle', time:0, enemies:[], towers:[], shots:[], parts:[],
     queue:[], spawnT:0, speed:1, sel:null, selTower:null, selEnemy:null, nextId:1, msg:''};
  document.getElementById('overlay').hidden=true;
  syncBar(); refreshInfo(); syncButtons();
}

function buildQueue(w){
  var counts=w.list.map(function(x){return [x[0],x[1]];}), q=[], any=true;
  while(any){
    any=false;
    counts.forEach(function(c){ if(c[1]>0){ q.push({t:c[0],gap:0.75}); c[1]--; any=true; } });
  }
  if(w.boss){ q[q.length-1].gap=2.5; q.push({t:'carno',gap:0.8}); }
  return q;
}

function spawn(type){
  var d=ENEMIES[type];
  var e={id:G.nextId++, type:type, hp:d.hp, maxhp:d.hp, dist:0, prog:0, x:pts[0].x, y:pts[0].y, fly:!!d.fly,
         slowUntil:0, slowF:1, jumpCd:0, spitCd:1.5, charging:false, chargeT:5, dead:false, jumpFx:0};
  G.enemies.push(e);
}

function towerAt(c,r){
  for(var k=0;k<G.towers.length;k++){ if(G.towers[k].c===c && G.towers[k].r===r) return G.towers[k]; }
  return null;
}

function tryPlace(type,c,r){
  var d=TOWERS[type], onPath=!!pathSet[c+','+r];
  if(type==='spike' && !onPath){ say('Spike Traps go on the brown track.'); return; }
  if(type!=='spike' && onPath){ say('That tile is the track. Only Spike Traps fit there.'); return; }
  if(G.gold<d.cost){ say('Not enough gold. '+d.name+' costs '+d.cost+'.'); return; }
  G.gold-=d.cost;
  var t={id:G.nextId++, type:type, c:c, r:r, x:(c+0.5)*CELL, y:(r+0.5)*CELL, cd:0, slowUntil:0, uses:10, hit:{}, cleanCd:2};
  G.towers.push(t);
  syncBar();
}

function say(m){ G.msg=m; G.selTower=null; G.selEnemy=null; refreshInfo(); }

/* ---------- update ---------- */
function damage(e,amt){
  if(e.dead) return;
  e.hp-=amt;
  if(e.hp<=0){
    e.dead=true;
    G.gold+=ENEMIES[e.type].gold;
    for(var k=0;k<6;k++){ G.parts.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*90,vy:(Math.random()-0.9)*70,t:0.5,col:'#e0b03c',g:true}); }
  }
}
function hasTotemBuff(t){
  for(var k=0;k<G.towers.length;k++){
    var o=G.towers[k];
    if(o.type==='totem' && dist(o.x,o.y,t.x,t.y)<=TOWERS.totem.range*CELL) return true;
  }
  return false;
}

function update(dt){
  if(G.state!=='running') return;
  G.time+=dt;
  var now=G.time, k, e;

  if(G.queue.length){
    G.spawnT-=dt;
    if(G.spawnT<=0){ var q=G.queue.shift(); spawn(q.t); G.spawnT=q.gap; }
  }

  for(k=0;k<G.enemies.length;k++){
    e=G.enemies[k]; if(e.dead) continue;
    var d=ENEMIES[e.type];
    var mult=(e.slowUntil>now)?e.slowF:1;
    if(e.type==='carno'){
      e.chargeT-=dt;
      if(e.charging){ if(e.chargeT<=0){ e.charging=false; e.chargeT=6; } mult*=2.2; }
      else if(e.chargeT<=0){ e.charging=true; e.chargeT=1.5; }
    }
    if(e.type==='troodon'){ e.jumpCd=Math.max(0,e.jumpCd-dt); e.jumpFx=Math.max(0,e.jumpFx-dt); }
    e.dist+=d.spd*CELL*mult*dt;
    var done=false;
    if(e.fly){
      var t=e.dist/flyLen;
      if(t>=1){ done=true; } else { e.x=flyStart.x+(flyEnd.x-flyStart.x)*t; e.y=flyStart.y+(flyEnd.y-flyStart.y)*t; }
      e.prog=e.dist*(total/flyLen);
    } else {
      if(e.dist>=total){ done=true; } else { var p=posAt(e.dist); e.x=p.x; e.y=p.y; }
      e.prog=e.dist;
    }
    if(done){ e.dead=true; e.leaked=true; G.lives-=d.boss?5:1; continue; }

    if(e.type==='dilo'){
      e.spitCd-=dt;
      if(e.spitCd<=0){
        var best=null, bd=1e9;
        G.towers.forEach(function(t2){
          if(t2.type==='spike') return;
          var dd=dist(e.x,e.y,t2.x,t2.y);
          if(dd<=2.6*CELL && dd<bd){ bd=dd; best=t2; }
        });
        if(best){
          best.slowUntil=now+6;
          G.shots.push({x1:e.x,y1:e.y,x2:best.x,y2:best.y,t:0.3,col:'#a6e04a',w:4});
          e.spitCd=3.5;
        } else { e.spitCd=0.4; }
      }
    }
  }

  /* spike traps */
  for(k=0;k<G.towers.length;k++){
    var s=G.towers[k];
    if(s.type!=='spike') continue;
    for(var j=0;j<G.enemies.length;j++){
      e=G.enemies[j];
      if(e.dead||e.fly||s.hit[e.id]) continue;
      if(dist(s.x,s.y,e.x,e.y)<16){
        s.hit[e.id]=true;
        if(e.type==='troodon' && e.jumpCd<=0){ e.jumpCd=1; e.jumpFx=0.4; continue; }
        damage(e,TOWERS.spike.dmg); s.uses--;
        for(var q2=0;q2<4;q2++){ G.parts.push({x:s.x,y:s.y,vx:(Math.random()-0.5)*80,vy:-Math.random()*60,t:0.35,col:'#c9ced4'}); }
        if(s.uses<=0){ s.gone=true; break; }
      }
    }
  }

  /* shooting towers and totems */
  for(k=0;k<G.towers.length;k++){
    var t3=G.towers[k], def=TOWERS[t3.type];
    if(t3.type==='spike') continue;
    if(t3.type==='totem'){
      t3.cleanCd-=dt;
      if(t3.cleanCd<=0){
        var cleaned=false;
        for(var m=0;m<G.towers.length;m++){
          var o=G.towers[m];
          if(o.slowUntil>now && dist(o.x,o.y,t3.x,t3.y)<=def.range*CELL){
            o.slowUntil=0; cleaned=true;
            for(var n=0;n<8;n++){ G.parts.push({x:o.x+(Math.random()-0.5)*16,y:o.y-6,vx:(Math.random()-0.5)*30,vy:20+Math.random()*40,t:0.6,col:'#a6e04a',g:false}); }
            G.shots.push({x1:t3.x,y1:t3.y,x2:o.x,y2:o.y,t:0.3,col:'#62c96c',w:3});
            break;
          }
        }
        t3.cleanCd=cleaned?5:0.5;
      }
      continue;
    }
    t3.cd-=dt;
    if(t3.cd>0) continue;
    var target=null, bp=-1;
    for(var z=0;z<G.enemies.length;z++){
      e=G.enemies[z];
      if(e.dead) continue;
      if(dist(t3.x,t3.y,e.x,e.y)<=def.range*CELL && e.prog>bp){ bp=e.prog; target=e; }
    }
    if(!target) continue;
    var cd=def.cd;
    if(t3.slowUntil>now) cd*=2;
    if(hasTotemBuff(t3)) cd/=1.3;
    t3.cd=cd;
    G.shots.push({x1:t3.x,y1:t3.y,x2:target.x,y2:target.y,t:0.1,col:def.color,w:2});
    damage(target,def.dmg);
    if(t3.type==='bola'){
      var f=target.fly?0.35:0.55;
      target.slowUntil=now+2; target.slowF=f;
    }
  }

  G.enemies=G.enemies.filter(function(x){return !x.dead;});
  var hadSel=G.selTower;
  G.towers=G.towers.filter(function(x){return !x.gone;});
  if(hadSel && hadSel.gone){ G.selTower=null; }

  for(k=0;k<G.parts.length;k++){
    var pp=G.parts[k]; pp.t-=dt; pp.x+=pp.vx*dt; pp.y+=pp.vy*dt; if(pp.g) pp.vy+=140*dt;
  }
  G.parts=G.parts.filter(function(x){return x.t>0;});
  for(k=0;k<G.shots.length;k++){ G.shots[k].t-=dt; }
  G.shots=G.shots.filter(function(x){return x.t>0;});

  if(G.lives<=0){ G.lives=0; endGame(false); return; }
  if(!G.queue.length && !G.enemies.length){ completeWave(); }
}

function completeWave(){
  if(G.wave>=WAVES.length){ endGame(true); return; }
  G.gold+=WAVE_BONUS; G.wave++; G.state='idle';
  G.msg='Wave cleared. +'+WAVE_BONUS+' gold. Build, then start the next wave.';
  refreshInfo(); syncButtons(); syncBar();
}

function endGame(win){
  G.state=win?'won':'lost';
  var ov=document.getElementById('overlay');
  document.getElementById('ovTitle').textContent=win?'Carnotaurus cleansed':'The track fell';
  document.getElementById('ovText').textContent=win
    ? 'The curse lets go of it. You collected Carno Horns, the gauntlet material.'
    : 'Too many dinosaurs got through. Rebuild and try a new layout.';
  ov.hidden=false; syncButtons();
}

/* ---------- drawing ---------- */
function strokePath(col,w){
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(var k=1;k<pts.length;k++) ctx.lineTo(pts[k].x,pts[k].y);
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='butt'; ctx.stroke();
}
function circle(x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=col; ctx.fill(); }

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var c,r,k;
  for(r=0;r<ROWS;r++){ for(c=0;c<COLS;c++){
    ctx.fillStyle=((c+r)%2)?'#3a5733':'#365230'; ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
  } }
  strokePath('#5a3b20',CELL*0.98);
  strokePath('#c8a36a',CELL*0.8);

  if(G.sel){
    for(r=0;r<ROWS;r++){ for(c=0;c<COLS;c++){
      var onP=!!pathSet[c+','+r], free=!towerAt(c,r);
      if(free && ((G.sel==='spike')===onP)){ ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(c*CELL+1,r*CELL+1,CELL-2,CELL-2); }
    } }
  }

  for(k=0;k<G.towers.length;k++) drawTower(G.towers[k]);

  if(G.selTower && G.selTower.type!=='spike'){
    var st=G.selTower;
    ctx.beginPath(); ctx.arc(st.x,st.y,TOWERS[st.type].range*CELL,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  if(G.selTower){ ctx.strokeStyle='#e0b03c'; ctx.lineWidth=2; ctx.strokeRect(G.selTower.c*CELL+2,G.selTower.r*CELL+2,CELL-4,CELL-4); }

  var ground=G.enemies.filter(function(x){return !x.fly;}), air=G.enemies.filter(function(x){return x.fly;});
  ground.forEach(drawEnemy);

  G.shots.forEach(function(s){
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2);
    ctx.strokeStyle=s.col; ctx.lineWidth=s.w; ctx.globalAlpha=clamp(s.t*5,0,1); ctx.stroke(); ctx.globalAlpha=1;
  });
  G.parts.forEach(function(p){ ctx.globalAlpha=clamp(p.t*3,0,1); circle(p.x,p.y,2.5,p.col); ctx.globalAlpha=1; });

  air.forEach(drawEnemy);

  if(G.selEnemy && !G.selEnemy.dead){
    var se=G.selEnemy;
    ctx.beginPath(); ctx.arc(se.x,se.y-(se.fly?8:0),ENEMIES[se.type].r+5,0,Math.PI*2);
    ctx.strokeStyle='#e0b03c'; ctx.lineWidth=2; ctx.stroke();
  }
}

function drawTower(t){
  var x=t.x, y=t.y, def=TOWERS[t.type];
  if(t.type==='spike'){
    ctx.globalAlpha=0.5+0.5*(t.uses/10);
    ctx.fillStyle='#9aa2aa';
    for(var s=-1;s<=1;s++){
      ctx.beginPath(); ctx.moveTo(x+s*10-5,y+9); ctx.lineTo(x+s*10,y-9); ctx.lineTo(x+s*10+5,y+9); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1; return;
  }
  circle(x,y,18,'#6e4a2a');
  circle(x,y,12,def.color);
  ctx.strokeStyle='#3d2a16'; ctx.lineWidth=2;
  ctx.beginPath();
  if(t.type==='spear'){ ctx.moveTo(x-6,y+6); ctx.lineTo(x+6,y-6); }
  else if(t.type==='slinger'){ ctx.arc(x,y,4,0,Math.PI*2); }
  else if(t.type==='bola'){ ctx.arc(x-3,y,3,0,Math.PI*2); ctx.moveTo(x+8,y); ctx.arc(x+5,y,3,0,Math.PI*2); }
  else if(t.type==='totem'){ ctx.moveTo(x,y-8); ctx.lineTo(x,y+8); ctx.moveTo(x-6,y-2); ctx.lineTo(x+6,y-2); }
  ctx.stroke();
  if(t.slowUntil>G.time){
    ctx.globalAlpha=0.55; circle(x,y,15,'#8fd13a'); ctx.globalAlpha=1;
    circle(x-6,y+13,2.5,'#8fd13a'); circle(x+5,y+15,2,'#8fd13a');
  }
}

function drawEnemy(e){
  var d=ENEMIES[e.type], x=e.x, y=e.y;
  if(e.fly){
    ctx.globalAlpha=0.25; ctx.beginPath(); ctx.ellipse(x,y+4,d.r,d.r*0.5,0,0,Math.PI*2); ctx.fillStyle='#000'; ctx.fill(); ctx.globalAlpha=1;
    y-=8;
    ctx.beginPath(); ctx.moveTo(x-d.r-5,y-2); ctx.lineTo(x,y+2); ctx.lineTo(x+d.r+5,y-2); ctx.lineTo(x,y-7); ctx.closePath();
    ctx.fillStyle='#a6afbf'; ctx.fill();
  }
  if(e.jumpFx>0) y-=8*Math.sin((e.jumpFx/0.4)*Math.PI);
  circle(x,y,d.r,d.color);
  if(e.type==='carno'){
    ctx.fillStyle='#e8dcc2';
    ctx.beginPath(); ctx.moveTo(x-9,y-d.r+3); ctx.lineTo(x-6,y-d.r-7); ctx.lineTo(x-3,y-d.r+3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+3,y-d.r+3); ctx.lineTo(x+6,y-d.r-7); ctx.lineTo(x+9,y-d.r+3); ctx.fill();
    if(e.charging){ ctx.strokeStyle='#ff9a3c'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,d.r+4,0,Math.PI*2); ctx.stroke(); }
  }
  if(e.type==='dilo'){ circle(x,y-d.r+1,3,'#d8b8f2'); }
  circle(x+d.r*0.35,y-d.r*0.2,Math.max(1.6,d.r*0.16),'#111');
  if(e.slowUntil>G.time){ ctx.strokeStyle='#5fd0e8'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,d.r+2,0,Math.PI*2); ctx.stroke(); }
  if(e.hp<e.maxhp){
    var bw=d.boss?34:22, by=y-d.r-(d.boss?11:6);
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(x-bw/2,by,bw,4);
    ctx.fillStyle=e.hp/e.maxhp>0.35?'#62c96c':'#e2574a'; ctx.fillRect(x-bw/2,by,bw*Math.max(0,e.hp/e.maxhp),4);
  }
}

/* ---------- UI ---------- */
var goldEl=document.getElementById('gold'), livesEl=document.getElementById('lives'), waveEl=document.getElementById('wave');
var infoEl=document.getElementById('infoText'), sellBtn=document.getElementById('sellBtn');
var startBtn=document.getElementById('startBtn'), speedBtn=document.getElementById('speedBtn'), barEl=document.getElementById('bar');

ORDER.forEach(function(key){
  var d=TOWERS[key], b=document.createElement('button');
  b.className='tw'; b.type='button'; b.id='tw-'+key; b.setAttribute('data-type',key); b.setAttribute('aria-pressed','false');
  b.innerHTML='<span class="sw" style="background:'+d.color+'"></span><span class="nm">'+d.name+'</span><span class="co">'+d.cost+'</span>';
  b.addEventListener('click',function(){
    G.sel=(G.sel===key)?null:key; G.selTower=null; G.selEnemy=null;
    G.msg=G.sel?(d.name+': '+d.note):''; refreshInfo(); syncBar();
  });
  barEl.appendChild(b);
});

function syncBar(){
  ORDER.forEach(function(key){
    var b=document.getElementById('tw-'+key);
    b.setAttribute('aria-pressed',G.sel===key?'true':'false');
    b.classList.toggle('poor',G.gold<TOWERS[key].cost);
  });
}
function syncButtons(){
  if(G.state==='idle'){ startBtn.disabled=false; startBtn.textContent='Start Wave '+G.wave; }
  else if(G.state==='running'){ startBtn.disabled=true; startBtn.textContent='Wave '+G.wave+' in progress'; }
  else { startBtn.disabled=true; startBtn.textContent='Level over'; }
}

function refreshInfo(){
  sellBtn.hidden=true;
  var now=G.time;
  if(G.selTower){
    var t=G.selTower, d=TOWERS[t.type], txt='<b>'+d.name+'</b><br>';
    if(t.type==='spike'){ txt+='Damage '+d.dmg+' per enemy · '+t.uses+' uses left'; }
    else if(t.type==='totem'){ txt+='Range '+d.range+' · +30% attack speed nearby'+(t.slowUntil>now?' · <span style="color:var(--bad)">Slimed</span>':''); }
    else { txt+='Damage '+d.dmg+' · '+(1/d.cd).toFixed(1)+' shots/s · Range '+d.range+(t.slowUntil>now?' · <span style="color:var(--bad)">Slowed 50%</span>':''); }
    infoEl.innerHTML=txt; sellBtn.hidden=false; sellBtn.textContent='Sell +'+Math.floor(d.cost*0.5);
  } else if(G.selEnemy && !G.selEnemy.dead){
    var e=G.selEnemy, ed=ENEMIES[e.type];
    infoEl.innerHTML='<b>'+ed.name+'</b> · '+Math.ceil(e.hp)+'/'+e.maxhp+' health · pays '+ed.gold+' gold<br>'+ed.note;
  } else if(G.msg){
    infoEl.textContent=G.msg;
  } else {
    infoEl.textContent='Pick a tower, then tap a free tile. Spike Traps go on the brown track.';
  }
}

function frame(ts){
  var dt=Math.min(0.05,(ts-(frame.last||ts))/1000); frame.last=ts;
  for(var s=0;s<G.speed;s++) update(dt);
  draw();
  goldEl.textContent=Math.floor(G.gold); livesEl.textContent=G.lives; waveEl.textContent=G.wave+'/'+WAVES.length;
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){ frame.acc=0; if(G.selEnemy||G.selTower) refreshInfo(); syncBar(); }
  requestAnimationFrame(frame);
}

cv.addEventListener('pointerdown',function(ev){
  var rect=cv.getBoundingClientRect();
  var x=(ev.clientX-rect.left)*W/rect.width, y=(ev.clientY-rect.top)*H/rect.height;
  var c=Math.floor(x/CELL), r=Math.floor(y/CELL);
  if(c<0||r<0||c>=COLS||r>=ROWS) return;
  G.msg='';
  var ex=towerAt(c,r);
  if(ex){ G.selTower=ex; G.selEnemy=null; G.sel=null; syncBar(); refreshInfo(); return; }
  if(G.sel){ tryPlace(G.sel,c,r); return; }
  var best=null, bd=1e9;
  G.enemies.forEach(function(e){
    var dd=dist(x,y,e.x,e.y);
    if(dd<ENEMIES[e.type].r+16 && dd<bd){ bd=dd; best=e; }
  });
  G.selEnemy=best; G.selTower=null; refreshInfo();
});

sellBtn.addEventListener('click',function(){
  var t=G.selTower; if(!t) return;
  G.gold+=Math.floor(TOWERS[t.type].cost*0.5);
  G.towers=G.towers.filter(function(x){return x!==t;});
  G.selTower=null; G.msg='Sold for half the cost.'; refreshInfo(); syncBar();
});
startBtn.addEventListener('click',function(){
  if(G.state!=='idle') return;
  G.queue=buildQueue(WAVES[G.wave-1]); G.spawnT=0; G.state='running'; G.msg='';
  G.selEnemy=null; refreshInfo(); syncButtons();
});
speedBtn.addEventListener('click',function(){
  G.speed=(G.speed===1)?2:1; speedBtn.textContent=G.speed+'x';
});
document.getElementById('ovBtn').addEventListener('click',function(){ reset(); speedBtn.textContent='1x'; });

reset();
requestAnimationFrame(frame);
})();
</script>

</body></html>
